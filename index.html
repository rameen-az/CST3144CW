
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Off Syllabus</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
    <script src="lessons.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <div id="app">
        <header>
            <button class="menu-button" aria-label="Menu">
                <span class="fa-solid fa-bars"></span>
            </button>

            <h1 v-text="sitename"></h1>

            <button class="cart-button">
                <span class="fa-solid fa-cart-shopping"></span>
            </button>
        </header>

        <main>

            
            <div class="lesson-grid">
                <div class="lesson-card"
                    v-for="product in products"
                    v-bind:key="product.id">

                    <figure>
                        <img v-bind:src="product.image" v-bind:alt="product.title">
                    </figure>

                    <h2 v-text="product.title"></h2>
                    <p v-html="product.description"></p>
                    <p><strong>Price:</strong> AED {{product.price}}</p>
                    <p><strong>Recommended Ages:</strong> {{product.ageGroup}}</p>
                    <p><strong>Duration:</strong> {{product.duration}}</p>
                    <p><strong>Instructor:</strong> {{product.instructor}}</p>
                    <p><strong>Schedule:</strong> {{product.schedule}}</p>
                    <p><strong>Location:</strong> {{product.location}}</p>
                    <p><strong>Available Seats:</strong> {{product.availableInventory}}</p>
                </div>
            </div>

        </main>
    </div>

    <script>
        let webstore = new Vue({
            el: '#app',
            data: {
                sitename: 'Off Syllabus',
                products: lessons
            }
        });
    </script>
</body>
</html>
